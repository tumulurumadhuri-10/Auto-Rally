
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Auto Rally - Racing Game</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2e7d32">

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #e8f5e9;
      text-align: center;
      margin: 0;
      padding: 15px;
    }

    h1 {
      color: #1b5e20;
    }

    h2 {
      color: #333333;
    }

    .game-info {
      background-color: white;
      padding: 15px;
      border-radius: 12px;
      max-width: 400px;
      margin: 15px auto;
    }

    .game-info p {
      font-size: 18px;
      font-weight: bold;
    }

    #startBtn {
      background-color: #2e7d32;
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
      margin: 10px;
    }

    #startBtn:hover {
      background-color: #1b5e20;
    }

    #gameCanvas {
      border: 3px solid black;
      border-radius: 10px;
      max-width: 100%;
      height: auto;
      display: block;
      margin: 10px auto;
      background-color: #555555;
      touch-action: none;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 35px;
      margin: 15px auto;
    }

    .control-btn {
      background-color: #1565c0;
      color: white;
      border: none;
      padding: 18px 30px;
      border-radius: 12px;
      font-size: 25px;
      cursor: pointer;
      touch-action: manipulation;
    }

    .control-btn:active {
      background-color: #0d47a1;
    }

    .instructions {
      font-size: 15px;
      color: #444444;
      margin: 15px auto;
    }
  </style>

</head>

<body>

  <h1>🛺 Auto Rally</h1>

  <p>Welcome to the Auto Rickshaw Racing Game!</p>

  <div class="game-info">

    <h2>🏁 Race Information</h2>

    <p>🪙 Coins: <span id="coins">0</span></p>

    <p>🏎️ Lap: <span id="lap">1</span> / 3</p>

    <p>⏱️ Time: <span id="timer">0:00</span></p>

    <p>
      🏆 Best Time:
      <span id="bestTime">Not recorded</span>
    </p>

  </div>

  <button id="startBtn">Start Race</button>
    <button id="soundBtn" type="button">
  🔊 Sound ON
</button>


  <h2>🛣️ Racing Track</h2>

  <canvas
    id="gameCanvas"
    width="400"
    height="500">
  </canvas>

  <div class="controls">

    <button
      id="leftBtn"
      class="control-btn"
      type="button">
      ⬅️
    </button>

    <button
      id="rightBtn"
      class="control-btn"
      type="button">
      ➡️
    </button>

  </div>

  <p class="instructions">
    Use the Left and Right Arrow keys on your computer.
    Touchscreen controls will be enabled next.
  </p>

  <script src="game.js"></script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function() {
      navigator.serviceWorker
        .register("./service-worker.js")
        .then(function() {
          console.log("Auto Rally offline service worker registered");
        })
        .catch(function(error) {
          console.log("Service worker error:", error);
        });
    });
  }
</script>

</body>

</html>
